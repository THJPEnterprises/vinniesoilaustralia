<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Reseller &amp; Wholesaler Login — Vinnie's Oil Australia</title>
<link rel="stylesheet" href="../css/style.css">
<style>
.portal-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--forest);
  padding: 2rem 5vw;
}
.portal-card {
  width: 100%;
  max-width: 420px;
  background: #fff;
  border-radius: 12px;
  padding: 2.75rem 2.5rem;
  box-shadow: 0 30px 80px rgba(0,0,0,0.35);
}
.portal-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 1.75rem; }
.portal-logo img { height: 34px; width: auto; }
.portal-logo span { font-size: 0.95rem; font-weight: 700; color: var(--forest); }
.portal-card h1 { font-size: 1.4rem; color: var(--forest); margin-bottom: 0.35rem; }
.portal-card > p.sub { font-size: 0.85rem; color: var(--grey-600); margin-bottom: 1.75rem; }
#portal-error, #portal-info {
  display: none;
  font-size: 0.8rem;
  padding: 0.75rem 1rem;
  border-radius: 6px;
  margin-bottom: 1.25rem;
}
#portal-error { background: rgba(200,60,10,0.08); color: #a13a00; border-left: 3px solid #c8460a; }
#portal-info { background: rgba(74,103,65,0.1); color: var(--pine); border-left: 3px solid var(--moss); }
.portal-footnote { font-size: 0.75rem; color: var(--grey-400); margin-top: 1.5rem; text-align: center; }
.portal-footnote a { color: var(--pine); text-decoration: underline; }
.back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; color: rgba(255,255,255,0.7); margin-bottom: 1.5rem; }
.back-link:hover { color: #fff; }

#toast-stack {
  position: fixed;
  top: 1.5rem;
  left: 50%;
  transform: translateX(-50%);
  z-index: 500;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  align-items: center;
  pointer-events: none;
}
.toast {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0.85rem 1.25rem;
  border-radius: 8px;
  font-size: 0.85rem;
  font-weight: 600;
  box-shadow: 0 12px 32px rgba(0,0,0,0.25);
  opacity: 0;
  transform: translateY(-12px);
  transition: opacity 0.25s ease, transform 0.25s ease;
  max-width: 90vw;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast-success { background: var(--moss); color: #fff; }
.toast-error { background: #c8460a; color: #fff; }
.toast svg { flex-shrink: 0; }
</style>
</head>
<body>

<div id="toast-stack"></div>

<div class="portal-wrap">
  <div style="position:absolute; top:2rem; left:5vw;">
    <a href="../index.html" class="back-link">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 2L4 7l7 5"/></svg>
      Back to main site
    </a>
  </div>

  <div class="portal-card">
    <div class="portal-logo">
      <img src="../images/Vinnies Oil Australia Logo.png" alt="Vinnie's Oil Australia">
      <span>Vinnie's Oil Australia</span>
    </div>

    <h1>Reseller &amp; Wholesaler Portal</h1>
    <p class="sub">Sign in with your business account to access wholesale pricing, ordering and dealer resources.</p>

    <div id="portal-error"></div>
    <div id="portal-info"></div>

    <form id="login-form" method="post" action="javascript:void(0);" novalidate>
      <div class="form-group">
        <label for="p-email">Email Address</label>
        <input type="email" id="p-email" name="email" placeholder="you@yourbusiness.com.au" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="p-password">Password</label>
        <input type="password" id="p-password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" id="login-btn" class="btn btn-primary btn-lg" style="width:100%; justify-content:center;">Sign In</button>
    </form>

    <p class="portal-footnote">
      Forgot your password? <a href="#" id="reset-link">Reset it here</a>.<br>
      Not a stockist yet? <a href="contact.html">Apply for wholesale access</a>.
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/portal-config.js"></script>
<script>
(function () {
const supabase = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
const form = document.getElementById('login-form');
const errBox = document.getElementById('portal-error');
const infoBox = document.getElementById('portal-info');
const btn = document.getElementById('login-btn');

function showError(msg) {
  errBox.textContent = msg;
  errBox.style.display = 'block';
  infoBox.style.display = 'none';
}
function showInfo(msg) {
  infoBox.textContent = msg;
  infoBox.style.display = 'block';
  errBox.style.display = 'none';
}

// Prominent, hard-to-miss confirmation banner (separate from the inline
// error/info boxes) — used to confirm actions like "reset email sent".
const toastStack = document.getElementById('toast-stack');
function showToast(msg, type) {
  const toast = document.createElement('div');
  toast.className = 'toast toast-' + (type === 'error' ? 'error' : 'success');
  const icon = type === 'error'
    ? '<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="9" r="7"/><path d="M9 6v3M9 12h0"/></svg>'
    : '<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="9" r="7"/><path d="M6 9l2 2 4-4"/></svg>';
  toast.innerHTML = icon + '<span></span>';
  toast.querySelector('span').textContent = msg;
  toastStack.appendChild(toast);
  requestAnimationFrame(() => toast.classList.add('show'));
  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => toast.remove(), 300);
  }, 4500);
}

// If already signed in, skip straight to the portal
supabase.auth.getSession().then(({ data }) => {
  if (data.session) window.location.href = 'portal.html';
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errBox.style.display = 'none';
  infoBox.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Signing in…';

  const email = document.getElementById('p-email').value.trim();
  const password = document.getElementById('p-password').value;

  const { error } = await supabase.auth.signInWithPassword({ email, password });

  btn.disabled = false;
  btn.textContent = 'Sign In';

  if (error) {
    showError(error.message === 'Invalid login credentials'
      ? 'Incorrect email or password. Please try again.'
      : error.message);
    return;
  }
  window.location.href = 'portal.html';
});

const resetLink = document.getElementById('reset-link');
resetLink.addEventListener('click', async (e) => {
  e.preventDefault();
  const email = document.getElementById('p-email').value.trim();
  if (!email) { showError('Enter your email above first, then click "Reset it here".'); return; }

  const originalText = resetLink.textContent;
  resetLink.textContent = 'Sending…';
  resetLink.style.pointerEvents = 'none';

  try {
    const { error } = await supabase.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + window.location.pathname
    });
    if (error) {
      showError(error.message);
      showToast(error.message, 'error');
      return;
    }
    showInfo('Password reset email sent — check your inbox. The link will bring you back here to set a new password.');
    showToast('Reset email sent to ' + email, 'success');
  } catch (err) {
    console.error('Password reset failed:', err);
    showError('Something went wrong sending the reset email: ' + (err?.message || err));
    showToast('Something went wrong sending the reset email', 'error');
  } finally {
    resetLink.textContent = originalText;
    resetLink.style.pointerEvents = '';
  }
});

// Handle the "PASSWORD_RECOVERY" flow: user arrives back here via the emailed
// link, already in a temporary authenticated state — prompt for a new password.
supabase.auth.onAuthStateChange(async (event, session) => {
  if (event === 'PASSWORD_RECOVERY') {
    const newPassword = window.prompt('Enter a new password for your account:');
    if (!newPassword) return;
    const { error } = await supabase.auth.updateUser({ password: newPassword });
    if (error) { showError(error.message); return; }
    showInfo('Password updated — you can now sign in.');
    await supabase.auth.signOut();
  }
});
})();
</script>
</body>
</html>
